name: Feature request
description: Propose a new feature or enhancement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For larger or riskier changes, consider whether this should start as an execution plan under `docs/exec-plans/active/` instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or what is currently missing?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (related issues, plans, or history entries).
