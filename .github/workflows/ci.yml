name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Split by what each half actually needs, rather than running everything on
  # one macOS runner. scripts/ci.sh is shell, Node, Python and Go -- none of it
  # needs macOS, and putting it there actively broke: `go test` for
  # apps/OpenComputerUseLinux built a darwin test binary that macOS 26's dyld
  # rejected ("missing LC_UUID load command", abort trap). Linux is also the
  # native platform for the module being tested.
  repo-checks:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          # Kept equal to release.yml and supply-chain-security.yml. See the
          # header of supply-chain-security.yml for why the three must agree.
          go-version: "1.27.x"
          # The self-hosted runner is long-lived, so its tool cache persists.
          # Without this the first cached 1.27 patch is reused forever.
          check-latest: true

      # Job body lives in scripts/ci/repo-checks.sh so scripts/local-ci.mjs
      # runs exactly what this step runs.
      - name: Run repository CI script
        run: bash scripts/ci/repo-checks.sh

  # The Swift package is this repository's primary deliverable, and
  # scripts/ci.sh has no swift step at all -- without this job a green CI run
  # would say nothing about the shipped binary. Runs on the self-hosted Mac;
  # release.yml still builds and signs on GitHub-hosted macos-26, so toolchain
  # parity with the release builder is not guaranteed by this job.
  swift:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-26' || fromJSON('["self-hosted","macOS","ARM64"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Build and test Swift package
        run: bash scripts/ci/swift.sh
