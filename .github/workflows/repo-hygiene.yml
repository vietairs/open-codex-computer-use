name: repo-hygiene

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: repo-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-hygiene:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run repository hygiene check
        run: ./scripts/check-repo-hygiene.sh

      - name: Run GitHub Action SHA pinning check
        run: ./scripts/check-action-pinning.sh
